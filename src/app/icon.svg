<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- window frame -->
  <rect x="0" y="0" width="32" height="32" fill="#0B0B10"/>
  <rect x="1" y="1" width="30" height="30" fill="#B0B3BC"/>
  <rect x="2" y="2" width="28" height="28" fill="#212CF4"/>
  <!-- title bar -->
  <rect x="2" y="2" width="28" height="6" fill="#171722"/>
  <rect x="3" y="3" width="4" height="4" fill="#212CF4"/>
  <rect x="25" y="3" width="4" height="4" fill="#FF3A66"/>
  <!-- web threads -->
  <g fill="#C3C6ED">
    <rect x="16" y="8" width="1" height="22"/>
    <rect x="2" y="19" width="28" height="1"/>
    <rect x="6" y="11" width="1" height="1"/><rect x="7" y="12" width="1" height="1"/><rect x="8" y="13" width="1" height="1"/>
    <rect x="25" y="11" width="1" height="1"/><rect x="24" y="12" width="1" height="1"/><rect x="23" y="13" width="1" height="1"/>
    <rect x="6" y="27" width="1" height="1"/><rect x="7" y="26" width="1" height="1"/><rect x="8" y="25" width="1" height="1"/>
    <rect x="25" y="27" width="1" height="1"/><rect x="24" y="26" width="1" height="1"/><rect x="23" y="25" width="1" height="1"/>
  </g>
  <!-- spider body -->
  <g fill="#FFFFFF">
    <rect x="14" y="13" width="5" height="4"/>
    <rect x="13" y="17" width="7" height="6"/>
    <rect x="14" y="23" width="5" height="2"/>
    <!-- legs -->
    <rect x="10" y="14" width="4" height="1"/><rect x="9" y="12" width="1" height="2"/>
    <rect x="19" y="14" width="4" height="1"/><rect x="23" y="12" width="1" height="2"/>
    <rect x="9" y="18" width="4" height="1"/><rect x="8" y="17" width="1" height="1"/>
    <rect x="20" y="18" width="4" height="1"/><rect x="24" y="17" width="1" height="1"/>
    <rect x="9" y="21" width="4" height="1"/><rect x="8" y="22" width="1" height="2"/>
    <rect x="20" y="21" width="4" height="1"/><rect x="24" y="22" width="1" height="2"/>
    <rect x="10" y="24" width="4" height="1"/><rect x="9" y="25" width="1" height="2"/>
    <rect x="19" y="24" width="4" height="1"/><rect x="23" y="25" width="1" height="2"/>
  </g>
  <!-- eyes -->
  <rect x="15" y="14" width="1" height="1" fill="#0B0B10"/>
  <rect x="17" y="14" width="1" height="1" fill="#0B0B10"/>
</svg>
